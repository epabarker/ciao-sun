[project]
name = "ciao-sun"
version = "0.1.0"
description = "Ciao Sun offline build pipeline and scoring reference, from Environment Agency LIDAR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
    "affine>=2.4",
    "pyproj>=3.6",
    "pvlib>=0.11",
    "pandas>=2.2",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "matplotlib>=3.8",
    "osmium>=4.0",
    "shapely>=2.0",
]

[project.scripts]
ciao-sun = "ciao_sun.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciao_sun"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's Option()/Argument() calls as argument defaults are the documented API.
"src/ciao_sun/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
